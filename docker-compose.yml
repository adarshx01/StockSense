name: stocksense

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: stocksense_local
      POSTGRES_DB: stocksense
    ports:
      - "5433:5432"
    volumes:
      - stocksense_pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense -d stocksense"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  stocksense_pg:
